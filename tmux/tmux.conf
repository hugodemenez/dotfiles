# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'niksingh710/minimal-tmux-status'

# Match macOS light/dark appearance for tmux + plugin
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null' \
  "set -g status-style 'fg=white,bg=black'; \
   set -g message-style 'fg=white,bg=black'; \
   set -g message-command-style 'fg=white,bg=black'; \
   set -g @minimal-tmux-fg '#ffffff'; \
   set -g @minimal-tmux-bg '#111111'" \
  "set -g status-style 'fg=black,bg=white'; \
   set -g message-style 'fg=black,bg=white'; \
   set -g message-command-style 'fg=black,bg=white'; \
   set -g @minimal-tmux-fg '#000000'; \
   set -g @minimal-tmux-bg '#f2f2f2'"

bind -r i resizep -U
bind -r u resizep -D
bind -r o resizep -R 
bind -r y resizep -L

bind -r h selectp -L
bind -r j selectp -D
bind -r k selectp -U
bind -r l selectp -R

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
